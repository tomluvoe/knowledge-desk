# Read-only MCP server over the local vault directory.
# Usage:
#   docker compose up --build
# Vault is mounted read-only; disposable FTS index is written outside the mount.
services:
  mcp:
    build: .
    image: knowledge-desk-mcp:local
    environment:
      KNOWLEDGE_DESK_ROOT: /vault
      KNOWLEDGE_DESK_INDEX_PATH: /tmp/knowledge-desk-index.sqlite
    volumes:
      - type: bind
        source: .
        target: /vault
        read_only: true
    ports:
      - "8000:8000"
    command:
      [
        "uv",
        "run",
        "--offline",
        "--no-sync",
        "knowledge-desk",
        "--vault",
        "/vault",
        "mcp",
        "serve",
        "--transport",
        "sse",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]
