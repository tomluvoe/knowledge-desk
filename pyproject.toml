[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-desk"
version = "0.1.0"
description = "A local-first knowledge desk for collecting, sorting, and discussing a cited corpus"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Knowledge Desk contributors" }]
dependencies = [
  "jsonschema>=4.23,<5",
  "mcp>=1.0,<2",
  "pypdf>=5.0,<7",
  "youtube-transcript-api>=1.0,<2",
]

[dependency-groups]
dev = []

[project.scripts]
knowledge-desk = "knowledge_desk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
required-version = "==0.11.29"
